<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build with AI 2026 — GDG Manila Resources</title>
  <meta name="description" content="Essential links, codelabs, and resources for Build with AI 2026: Break the Pattern — GDG Manila">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge">
        <span class="dot dot-blue"></span>
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span id="heroBadge"></span>
      </div>
      <h1 id="heroHeading"></h1>
      <p class="hero-intro" id="heroIntro"></p>
      <div class="hero-details" id="heroDetails">
        <div class="hero-details-content" id="heroDetailsContent"></div>
      </div>
      <button class="hero-toggle" id="heroToggle" onclick="toggleHeroDetails()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </header>
  <main class="content">
    <section class="section">
      <div class="section-label" id="creditsLabel"></div>
      <div class="section-title" id="creditsTitle"></div>
      <div class="section-desc" id="creditsDesc"></div>
      <div class="checklist-wrapper">
        <div class="checklist-progress">
          <div class="checklist-bar"><div class="checklist-fill" id="checkFill"></div></div>
          <div class="checklist-pct" id="checkPct">0%</div>
        </div>
        <div class="check-steps" id="checkSteps"></div>
        <div class="checklist-badge" id="checkBadge" onclick="expandChecklist()">
          <div class="badge-text" id="badgeText"></div>
          <div class="badge-sub" id="badgeSub"></div>
          <div class="badge-expand" id="badgeExpand">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </div>
    </section>

    <div class="post-checklist-content" id="postChecklistContent">
      <div class="post-checklist-inner">
        <div class="divider"></div>
        <section class="section">
          <div class="section-label" id="workshopsLabel"></div>
          <div class="section-title" id="workshopsTitle"></div>
          <div class="section-desc" id="workshopsDesc"></div>
          <div id="workshopsList"></div>
        </section>

        <div class="divider"></div>
        <section class="section">
          <div class="section-label" id="communityLabel"></div>
          <div class="section-title" id="communityTitle"></div>
          <div class="section-desc" id="communityDesc"></div>
          <div class="social-grid" id="socialGrid"></div>
        </section>
        <div class="divider"></div>
        <footer class="footer">
          <div class="footer-dots">
            <span class="dot dot-blue"></span>
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <p id="footerLine1"></p>
          <p id="footerLine2"></p>
        </footer>
      </div>
    </div>

  </main>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
